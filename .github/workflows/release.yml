# Builds the addon zip and uploads it to CurseForge and Wago when a tag is pushed.
# The tag name is the version; a tag containing "alpha" or "beta" is uploaded as such,
# anything else as a release. Needs the repository secrets CURSEFORGE and WAGO
# (GITHUB_TOKEN is provided by GitHub). Project IDs come from the TOC.
name: Package and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CURSEFORGE }}
      WAGO_API_TOKEN: ${{ secrets.WAGO }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog of this version only
        # CurseForge and Wago show CHANGELOG.md; cut it down to the section of the tag
        # (3.1.3-alpha4 -> "## 3.1.3 (alpha 4)", 3.1.3 -> "## 3.1.3").
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^(.+)-(alpha|beta)([0-9]+)$ ]]; then
            heading="## ${BASH_REMATCH[1]} (${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
          else
            heading="## ${tag}"
          fi
          # From the heading to the next "---" line or the next "## " heading, whichever comes first.
          awk -v h="$heading" '$0 == h {on=1; print; next} on && (/^---/ || /^## /) {exit} on' CHANGELOG.md > CHANGELOG.cut
          if [ ! -s CHANGELOG.cut ]; then
            echo "::error::No section '$heading' in CHANGELOG.md"
            exit 1
          fi
          mv CHANGELOG.cut CHANGELOG.md
          cat CHANGELOG.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # File name and CurseForge label: RollAway_<tag> (e.g. RollAway_3.1.3-alpha4, RollAway_3.1.3).
          args: -n "{package-name}_{project-version}:{package-name}_{project-version}"
